# Hyprlock 现代扁平风配置文件

# -----------------------------------------------------
# 全局设置
# -----------------------------------------------------
general {
    disable_loading_bar = true # 禁用底部的加载条，保持简洁
    hide_cursor = true         # 隐藏鼠标指针
    grace = 0
    no_fade_in = false
}

# -----------------------------------------------------
# 背景设置
# -----------------------------------------------------
background {
    monitor =
    # 选项 1: 使用当前屏幕截图并进行重度模糊 (现代感强)
    path = screenshot
    blur_passes = 3 # 模糊次数，越高越模糊
    blur_size = 3   # 模糊半径
    noise = 0.2     # 添加轻微噪点增加质感

    # 如果使用图片，以下参数可调节画面风格
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# -----------------------------------------------------
# 输入框 (核心交互区)
# -----------------------------------------------------
# 体现了“扁平”和“合理圆角”
input-field {
    monitor =
    size = 300, 55             # 宽度和高度，略宽的矩形
    outline_thickness = 0      # 无边框，极致扁平
    dots_size = 0.25           # 输入时圆点的大小
    dots_spacing = 0.3         # 圆点间距
    dots_center = true         # 圆点居中显示
    dots_rounding = -1         # 圆点变为正圆形

    # 颜色设置 (扁平化配色)
    inner_color = rgba(255, 255, 255, 0.1) # 极淡的半透明白色背景
    font_color = rgb(255, 255, 255)        # 输入文字颜色
    fade_on_empty = true      #即使没输入也不隐藏输入框，保持占位感
    placeholder_text = <i>Password...</i> # 占位符文本
    
    # 位置与圆角
    position = 0, -180         # 位于屏幕中心向下偏移 100px
    halign = center
    valign = center
    
    # 【关键设计点】合理的圆角
    rounding = 16 # 适度的圆角，既不尖锐也不过于圆润(胶囊状)，现代感强
}

# -----------------------------------------------------
# 时间显示 (大号字体)
# -----------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +'%H:%M')</b>"
    color = rgb(255, 255, 255)
    
    # 字体设置：建议使用粗体无衬线字体，例如 "Inter Bold" 或 "Roboto Bold"
    font_size = 100
    font_family = Monospace
    
    position = 0, 0 # 位于屏幕中心向上偏移
    halign = center
    valign = center
    
    # 阴影设置 (轻微的文字阴影增加层次感，但仍保持扁平)
    shadow_passes = 1
    shadow_size = 4
    shadow_color = rgb(0,0,0)
    shadow_boost = 0.3
}

# -----------------------------------------------------
# 日期显示 (小号字体)
# -----------------------------------------------------
label {
    monitor =
    text = cmd[update:1800000] echo "$(date +'%A, %B %d')" # 例: Monday, February 12
    color = rgba(255, 255, 255, 0.8) # 稍低透明度的白色
    
    # 字体设置
    font_size = 22
    font_family = Sans
    
    position = 0, -100 # 位于时间下方
    halign = center
    valign = center
}

# -----------------------------------------------------
# (可选) 用户头像
# 如果你想添加头像，取消下面段落的注释，并修改 path
# -----------------------------------------------------
image {
    monitor =
    path = /home/kelly/Pictures/avatar.jpg # 替换为你的头像路径
    size = 240 # 头像大小
    rounding = -1 # -1 表示完美的圆形
    border_size = 3
    border_color = rgba(255, 255, 255, 0.2) # 微弱的边框
    position = 0, 200 # 位于时间上方
    halign = center
    valign = center
    # 注意：如果启用头像，你可能需要向下调整时间和日期的 position Y值，避免重叠。
}

# -----------------------------------------------------
# 右上角状态胶囊 (Wifi 和 电池)
# -----------------------------------------------------
label {
    monitor =
    # 调用我们刚才编写的脚本，每 5000 毫秒 (5秒) 更新一次
    text = cmd[update:10000] echo "$($HOME/.config/hypr/scripts/get_status.sh)"

    color = rgba(255, 255, 255, 0.9)
    font_size = 14
    # 确保使用支持图标的字体，如 JetBrainsMono Nerd Font
    font_family = Monospace

    # 扁平化的半透明胶囊背景
    background_color = rgba(255, 255, 255, 0.1)
    padding = 15, 10
    rounding = 20 # 胶囊状圆角

    # 位置：右上角
    position = -20, -20 # 距离右边缘和上边缘各 20px
    halign = right
    valign = top
}
