
# #######################################################################################
# AUTOGENERATED HYPR CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hypr.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

# autogenerated = 1 # remove this line to remove the warning

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/Configuring-Hyprland/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
# monitor=,preferred,auto,auto
monitor=eDP-1, 2256x1504@60, 0x0, 1.175
monitor=DP-2, 2560x1440@165, 0x0, 1
monitor=DP-1, 2560x1440@165, 2560x0, 1
# monitor=DP-3, 2560x1440@170, 5120x0, 1

# workspace = 1, monitor:DP-1, on-created-empty:kitty, default:true
# workspace = 2, monitor:DP-3, on-created-empty:telegram-desktop
# workspace = 2, monitor:DP-2
workspace = special:email, on-created-empty:thunderbird

###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = dolphin
$menu = ulauncher-toggle
$lock = 1password --lock & hyprlock


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
exec-once = nm-applet
exec-once = waybar
exec-once = GDK_BACKEND=wayland ulauncher --hide-window
exec-once = fcitx5
exec-once = swaync
exec-once = wayvnc 0.0.0.0
exec-once = solaar --window=hide
exec-once = XDG_MENU_PREFIX=arch- kbuildsycoca6
# exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = /usr/lib/pam_kwallet_init
exec-once = hypridle
exec-once = clash-verge

exec-once = mpd
exec-once = mpdris2-rs
exec-once = 1password --silent
exec = darkman set dark

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,hyprqt6engine
env = XDG_MENU_PREFIX,arch-
# env = HTTP_PROXY,http://127.0.0.1:7897
# env = HTTPS_PROXY,http://127.0.0.1:7897

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general { 
    gaps_in = 5
    gaps_out = 5,10,10,10

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false 

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 15

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        render_power = 3
        color = rgba(1a1a1aee)
        range = 4
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1
        
        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more
    # NOTE: Definition:
    # animation=NAME,ONOFF,SPEED,CURVE[,STYLE]

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    $duration = 5 # 5ds = 500ms

    animation = windows, 1, $duration, myBezier
    animation = windowsOut, 1, $duration, default, popin 80%
    animation = border, 1, $duration, default
    animation = borderangle, 1, $duration, default
    animation = fade, 1, $duration, default
    animation = workspaces, 1, $duration, default
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc { 
    force_default_wallpaper = 2 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}

binds {
  scroll_event_delay = 0
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    repeat_delay = 170
    repeat_rate = 40

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
        scroll_factor = 0.8
        disable_while_typing = true
        tap-and-drag = true
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gesture = 3, horizontal, workspace
gesture = 4, horizontal, workspace
gesture = 3, swipe, mod:SUPER SHIFT, resize
gesture = 3, swipe, mod:SUPER, move 

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


####################
### KEYBINDINGSS ###
####################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Return, exec, $terminal
bind = $mainMod SHIFT, Q, killactive,
bind = $mainMod SHIFT, E, exit,
bind = $mainMod, D, exec, $fileManager
bind = $mainMod SHIFT, F, togglefloating
bind = $mainMod, TAB, cyclenext
bind = $mainMod, Space, exec, $menu
bind = $mainMod SHIFT, Space, exec, 1password --quick-access
bind = $mainMod, B, exec, brave
# bind = $mainMod, P, pseudo, # dwindle
# bind = $mainMod, J, togglesplit, # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Move window
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod SHIFT, Delete, movetoworkspace, special:magic
bind = $mainMod, Delete, togglespecialworkspace, magic

# Thunderbird special workspace
bind = $mainMod SHIFT, T, togglespecialworkspace, email

# Scroll through existing workspaces with mainMod + scroll
# bind = $mainmod, mouse_down, workspace, e+1
# bind = $mainmod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Screenshot
bind = $mainMod SHIFT, a, exec, slurp | grim -g - - | swappy -f - -o - | wl-copy
bind = $mainMod SHIFT, s, exec, hyprshot -z -m window --clipboard-only

# Player
# Example volume button that allows press and hold, volume limited to 150%
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
# Example volume button that will activate even while an input inhibitor is active
bindl = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0

# Controlling volume with mouse
bind = $mainMod, mouse_down, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 1%+
bind = $mainMod, mouse_up, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-

# Brightness
bindl = , XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindl = , XF86MonBrightnessDown, exec, brightnessctl s 10%-

# MPD
bind = $mainMod, p, exec, mpc toggle
bindl = , XF86AudioPlay, exec, mpc toggle
bindl = , XF86AudioPrev, exec, mpc prev
bindl = $mainMod, mouse:275, exec, mpc next 
bindl = $mainMod, mouse:276, exec, mpc prev
bindl = , XF86AudioNext, exec, mpc next
bindl = $mainMod, comma, exec, mpc prev
bindl = $mainMod, period, exec, mpc next 

# Lock
bind = $mainMod CONTROL, l, exec, $lock
bindl = $mainMod CONTROL, l, dpms, toggle

bind = $mainMod SHIFT, Return, exec, kitty --class=kitty-tmp

# Toggle Bar
bind = $mainMod SHIFT, b, exec, killall -s SIGUSR1 waybar

bind = , F11, fullscreen

##############################
### WINDOWS AND WORKSPACES ###
##############################

exec = gsettings set org.gnome.desktop.interface gtk-theme "Breeze-Dark"   # for GTK3 apps
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"   # for GTK4 apps
exec = gsettings set org.gnome.desktop.wm.preferences theme "Breeze-Dark";

env = QT_QPA_PLATFORMTHEME,qt6ct   # for Qt apps
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

windowrule = match:class .*, suppress_event maximize # You'll probably like this.

# Ulauncher main window
windowrule {
    name = ulauncher-main
    match:class = ^(ulauncher)$
    match:title = ^(Ulauncher - Application Launcher)$
    
    border_size = 0
    # opacity = 0.9
    no_shadow = on
    no_blur = on
    dim_around = on
    stay_focused = on
}

# Ulauncher preferences
windowrule {
    name = ulauncher-prefs
    match:class = ^(ulauncher)$
    match:title = ^(Ulauncher Preferences)$
    
    float = on
    no_blur = on
    no_shadow = on
    border_size = 0
}

# Disable blur and shadow for popups
windowrule = match:class ^()$, no_blur on
windowrule = match:class ^()$, no_shadow on

# VLC open dialog
windowrule {
    name = vlc-open
    match:class = ^(vlc)$
    match:title = (o|O)pen
    
    min_size = 1200 800
    center = on
}

# WeChat
windowrule {
    name = wechat-window
    match:initial_class = ^(wechat)$
    
    float = on
    no_blur = on
    border_size = 0
    decorate = off
}

# QQ
windowrule {
    name = qq-window
    match:class = ^(QQ)$
    
    float = on
    size = 1200 800
    center = on
}

# Brave login windows
windowrule {
    name = brave-login
    match:class = ^(brave-browser)$
    match:title = .*((S|s)ign\s?in|log\s?in).*
    
    float = on
    min_size = 400 600
    center = on
}

# Telegram on workspace 1
windowrule {
    name = telegram-ws1
    match:class = ^(org\.telegram\.desktop)$
    match:workspace = 1
    match:float = true
    match:initial_title = ^(Telegram).*
    
    float = on
    min_size = 410 580
    max_size = 430 800
}

# Telegram media viewer
windowrule {
    name = telegram-media
    match:class = ^(org\.telegram\.desktop)$
    match:title = .*Media viewer.*
    
    float = on
}

# PavuControl
windowrule {
    name = pavucontrol-window
    match:initial_class = ^(org\.pulseaudio\.pavucontrol)$
    
    float = on
    min_size = 500 800
    max_size = 800 1000
}

# Blueman Manager
windowrule {
    name = blueman-window
    match:initial_class = ^(blueman-manager)$
    
    float = on
    min_size = 200 600
    max_size = 600 800
}

# 1Password quick access
windowrule {
    name = onepassword-quick
    match:title = ^(Quick Access — 1Password)$
    
    dim_around = on
    stay_focused = on
}

# kitty-tmp
windowrule {
    name = kitty-tmp
    match:class = ^(kitty-tmp)$
    
    float = on
    center = on
    dim_around = on
    size = 600 400
}
