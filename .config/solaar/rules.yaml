%YAML 1.3
---
- MouseGesture: Mouse Down-right
- Execute: [playerctl, next]
...
---
- And:
  - MouseGesture: Mouse Up-right
- Execute: [playerctl, play-pause]
...
---
- MouseGesture: Mouse Down-left
- Execute: [playerctl, previous]
...
---
- MouseGesture: Mouse Right
- Execute: [hyprctl, dispatch, movewindow, r]
...
---
- MouseGesture: Mouse Left
- Execute: [hyprctl, dispatch, movewindow, l]
...
---
- MouseGesture: Mouse Down
- Execute: [hyprctl, dispatch, killactive]
...
