<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <match target="pattern">
    <test qual="any" name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="assign">
      <string>Maple Mono NF CN</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family">
      <string>ui-monospace</string>
    </test>
    <edit name="family" mode="assign">
      <string>Maple Mono NF CN</string>
    </edit>
  </match>

  <!-- Add Font Awesome as fallback for sans-serif -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Font Awesome 7 Free</string>
      <string>Font Awesome 7 Brands</string>
    </edit>
  </match>

  <!-- Add Font Awesome as fallback for serif -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Font Awesome 7 Free</string>
      <string>Font Awesome 7 Brands</string>
    </edit>
  </match>

  <!-- Add Font Awesome as fallback for monospace -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Font Awesome 7 Free</string>
      <string>Font Awesome 7 Brands</string>
    </edit>
  </match>
</fontconfig>
